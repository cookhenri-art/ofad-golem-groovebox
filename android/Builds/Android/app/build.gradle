apply plugin: 'com.android.application'

// v0.46.1 (audit F5) : clé de publication de GOLEM, gardée HORS du dépôt, dans le dossier de
// l'utilisateur : %USERPROFILE%\.ofad-golem\keystore.properties (créée par scripts\creer-cle-android.bat).
// Sans ce fichier, la version « release » reste signée avec la clé de débogage (comme avant) et la
// compilation le signale. Attention : passer de l'une à l'autre oblige à désinstaller l'ancienne APK
// une fois. Ce bloc est à reporter si Projucer régénère ce fichier.
def golemKeyFile = new File(System.properties['user.home'], ".ofad-golem${File.separator}keystore.properties")
def golemKey = new Properties()
if (golemKeyFile.exists()) golemKeyFile.withInputStream { golemKey.load(it) }
def golemHasKey = golemKeyFile.exists() && golemKey['storeFile'] && new File(golemKey['storeFile'].toString()).exists()
if (!golemHasKey) println "ATTENTION : clé de publication absente (${golemKeyFile}) : APK signée avec la clé de débogage."

def ndkVersionString = "28.1.13356709"

android {
    compileSdk 35
    ndkVersion ndkVersionString
    namespace "ofad.groovebox"
    externalNativeBuild {
        cmake {
            path "CMakeLists.txt"
            version "3.22.1"
        }
    }
    signingConfigs {
        juceSigning {
            storeFile     file("${System.properties['user.home']}${File.separator}.android${File.separator}debug.keystore")
            storePassword "android"
            keyAlias      "androiddebugkey"
            keyPassword   "android"
            storeType     "jks"
        }
        golemRelease {
            if (golemHasKey) {
                storeFile     file(golemKey['storeFile'])
                storePassword golemKey['storePassword'] ?: System.getenv("GOLEM_KEY_PASSWORD")
                keyAlias      golemKey['keyAlias'] ?: "golem"
                keyPassword   golemKey['keyPassword'] ?: golemKey['storePassword'] ?: System.getenv("GOLEM_KEY_PASSWORD")
                storeType     golemKey['storeType'] ?: "pkcs12"
            }
        }
    }

    defaultConfig {
        applicationId "ofad.groovebox"
        minSdkVersion    26
        targetSdkVersion 35
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_TOOLCHAIN=clang", "-DANDROID_PLATFORM=android-26", "-DANDROID_STL=c++_static", "-DANDROID_CPP_FEATURES=exceptions rtti", "-DANDROID_ARM_MODE=arm", "-DANDROID_ARM_NEON=TRUE", "-DANDROID_WEAK_API_DEFS=ON", "-DCMAKE_CXX_STANDARD=20", "-DCMAKE_CXX_EXTENSIONS=OFF"
            }
        }
    }

    buildTypes {
         debug {
             initWith debug
             debuggable    true
             jniDebuggable true
             signingConfig signingConfigs.juceSigning
         }
         release {
             initWith release
             debuggable    false
             jniDebuggable false
             signingConfig golemHasKey ? signingConfigs.golemRelease : signingConfigs.juceSigning
         }
    }

    flavorDimensions "default"
    productFlavors {
        debug_ {
            ndk {
                abiFilters "arm64-v8a"
            }
            externalNativeBuild {
                cmake {
                    cFlags    "-O0"
                    cppFlags  "-O0"
                    arguments "-DJUCE_BUILD_CONFIGURATION=DEBUG"
                }
            }

            dimension "default"
        }
        release_ {
            ndk {
                abiFilters "arm64-v8a", "armeabi-v7a"
            }
            externalNativeBuild {
                cmake {
                    cFlags    "-O3"
                    cppFlags  "-O3"
                    arguments "-DJUCE_BUILD_CONFIGURATION=RELEASE"
                }
            }

            dimension "default"
        }
    }

    variantFilter { variant ->
        def names = variant.flavors*.name
        if (names.contains ("debug_")
              && variant.buildType.name != "debug") {
            setIgnore(true)
        }
        if (names.contains ("release_")
              && variant.buildType.name != "release") {
            setIgnore(true)
        }
    }

    sourceSets {
        main.java.srcDirs +=
            ["../../../../../JUCE/juce-8.0.12-windows/JUCE/modules/juce_core/native/javacore/init",
             "../../../../../JUCE/juce-8.0.12-windows/JUCE/modules/juce_core/native/javacore/app"]

        main.res.srcDirs +=
            []
    }

    repositories {
    }

    dependencies {
    }



}

