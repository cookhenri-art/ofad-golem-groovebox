# Groovebox — OFAD — AGPL-3.0-or-later
# v0.47 : compilation Apple sur les Mac de GitHub (gratuits pour un dépôt public).
#  - Mac : application autonome, VST3 et AU (non signés : clic droit › Ouvrir au premier lancement) ;
#  - iPhone / iPad : application NON SIGNÉE (Groovebox-iOS-non-signe.ipa). Elle ne s'installe pas telle
#    quelle : il faut la signer avec un compte Apple (signature automatique à ajouter ici).
name: Apple

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "ui/**"
      - "resources/**"
      - "CMakeLists.txt"
      - "cmake/**"
      - "third_party/**"
      - ".github/workflows/apple.yml"

concurrency:
  group: apple-${{ github.ref }}
  cancel-in-progress: true

env:
  JUCE_TAG: "8.0.12"
  JUCE_SHA: "29396c22c93392d6738e021b83196283d6e4d850" # v0.46.1 (audit F6) : commit attendu pour cette étiquette

# v0.46.1 (audit F6) : jeton GitHub en lecture seule ; actions épinglées par empreinte de commit
# (une étiquette « v4 » peut être déplacée, une empreinte non) ; dépendances npm du fichier verrou seulement.
permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Interface React
        working-directory: ui
        run: |
          npm ci
          npm run build

      - name: JUCE
        run: |
          git clone --depth 1 --branch "$JUCE_TAG" https://github.com/juce-framework/JUCE.git "$RUNNER_TEMP/JUCE"
          test "$(git -C "$RUNNER_TEMP/JUCE" rev-parse HEAD)" = "$JUCE_SHA"

      # v0.49 : émulateur FM-1 du FM Player (Rust ; compilé par CMake avec cargo)
      - name: Rust (iPhone / iPad)
        run: rustup target add aarch64-apple-ios

      - name: Projet Xcode (iPhone / iPad)
        env:
          IPHONEOS_DEPLOYMENT_TARGET: "15.0"
        run: |
          cmake -S . -B build-ios -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DGROOVEBOX_BUILD_TESTS=OFF \
            -DJUCE_DIR="$RUNNER_TEMP/JUCE"

      - name: Compilation (sans signature)
        env:
          IPHONEOS_DEPLOYMENT_TARGET: "15.0"
        run: |
          xcodebuild -project build-ios/Groovebox.xcodeproj -scheme Groovebox_Standalone \
            -configuration Release -sdk iphoneos -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            -derivedDataPath build-ios/dd -quiet build

      - name: Paquet .ipa non signé
        run: |
          APP=$(find build-ios -name "Groovebox.app" -type d -path "*Standalone*" | head -1)
          [ -n "$APP" ] || APP=$(find build-ios -name "Groovebox.app" -type d | head -1)
          echo "Application : $APP"
          test -n "$APP"
          mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          # v0.47.0 : noms de publication avec la version (lue dans CMakeLists.txt)
          VER=$(sed -n 's/^project(Groovebox VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          test -n "$VER"
          (cd out && zip -qry "OFAD-GOLEM-$VER-iOS-non-signe.ipa" Payload)
          (cd out && shasum -a 256 *.ipa > SHA256SUMS-iOS.txt && cat SHA256SUMS-iOS.txt) # v0.46.1 (audit F4)
          ls -la out

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Groovebox-iOS-non-signe
          path: |
            out/*.ipa
            out/SHA256SUMS-iOS.txt
          retention-days: 30

  macos:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Interface React
        working-directory: ui
        run: |
          npm ci
          npm run build

      - name: JUCE
        run: |
          git clone --depth 1 --branch "$JUCE_TAG" https://github.com/juce-framework/JUCE.git "$RUNNER_TEMP/JUCE"
          test "$(git -C "$RUNNER_TEMP/JUCE" rev-parse HEAD)" = "$JUCE_SHA"

      - name: Rust (Mac Apple Silicon et Intel)
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Compilation (Mac Apple Silicon et Intel)
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          cmake -S . -B build-mac -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            -DGROOVEBOX_BUILD_TESTS=OFF \
            -DJUCE_DIR="$RUNNER_TEMP/JUCE"
          cmake --build build-mac --parallel --target Groovebox_Standalone Groovebox_VST3 Groovebox_AU

      - name: Signature locale (sans compte Apple)
        run: |
          # signature « ad hoc » : sans elle, macOS déclare l'appli « endommagée » au lieu de proposer
          # « Ouvrir quand même » (la vraie signature, avec certificat Apple, viendra avec le compte)
          A=build-mac/Groovebox_artefacts/Release
          for b in "$A/Standalone/Groovebox.app" "$A/VST3/Groovebox.vst3" "$A/AU/Groovebox.component"; do
            codesign --force --deep --sign - "$b"
            codesign --verify --deep --strict "$b" && echo "signé : $b"
          done

      - name: Paquet Mac
        run: |
          A=build-mac/Groovebox_artefacts/Release
          mkdir -p out
          # v0.47.0 : noms de publication avec la version (lue dans CMakeLists.txt)
          VER=$(sed -n 's/^project(Groovebox VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          test -n "$VER"
          ditto -c -k --keepParent "$A/Standalone/Groovebox.app" "out/OFAD-GOLEM-$VER-Mac-app.zip"
          ditto -c -k --keepParent "$A/VST3/Groovebox.vst3" "out/OFAD-GOLEM-$VER-Mac-VST3.zip"
          ditto -c -k --keepParent "$A/AU/Groovebox.component" "out/OFAD-GOLEM-$VER-Mac-AU.zip"
          (cd out && shasum -a 256 *.zip > SHA256SUMS-Mac.txt && cat SHA256SUMS-Mac.txt) # v0.46.1 (audit F4)
          ls -la out

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Groovebox-Mac-non-signe
          path: |
            out/*.zip
            out/SHA256SUMS-Mac.txt
          retention-days: 30
